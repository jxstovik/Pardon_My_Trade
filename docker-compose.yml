services:
  pmt:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PMT_ENV: ${PMT_ENV:-local}
      PMT_DATA_DIR: /data
      PMT_HOST: 0.0.0.0
      PMT_PORT: 3000
      PMT_WEB_PASSWORD: ${PMT_WEB_PASSWORD:?Set PMT_WEB_PASSWORD in .env}
      PMT_COOKIE_SECURE: "true"
      PMT_PLATFORM: ${PMT_PLATFORM:-fixture}
      PMT_LEAGUE_ID: ${PMT_LEAGUE_ID:-}
      PMT_TEAM_ID: ${PMT_TEAM_ID:-}
      PMT_SEASON: ${PMT_SEASON:-2026}
      ESPN_LEAGUE_ID: ${ESPN_LEAGUE_ID:-}
      ESPN_SEASON: ${ESPN_SEASON:-2026}
      ESPN_S2: ${ESPN_S2:-}
      SWID: ${SWID:-}
      PMT_MCP_ROLE: read
      PMT_EXECUTION_ENABLED: "false"
    volumes:
      - pmt-data:/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      pmt:
        condition: service_healthy
    environment:
      PMT_DOMAIN: ${PMT_DOMAIN:?Set PMT_DOMAIN to a DNS name for automatic HTTPS}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  pmt-data:
  caddy-data:
  caddy-config:
