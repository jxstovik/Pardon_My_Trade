<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pardon My Trade — Assistant</title>
  <style>
    :root {
      --bg: #0f1420;
      --panel: #18202f;
      --panel-2: #1f293b;
      --text: #e6ebf2;
      --muted: #93a1b5;
      --accent: #4f9dff;
      --good: #3ecf8e;
      --warn: #ffb454;
      --bad: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 18px 24px;
      background: var(--panel);
      border-bottom: 1px solid #243044;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 18px; margin: 0; }
    header .meta { color: var(--muted); font-size: 13px; }
    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 20px 24px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .panel {
      background: var(--panel);
      border: 1px solid #243044;
      border-radius: 12px;
      padding: 16px;
    }
    .panel h2 {
      margin: 0 0 12px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .full { grid-column: 1 / -1; }
    button {
      background: var(--accent);
      color: #06101f;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    .report { line-height: 1.5; }
    .report .title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    .report ul { margin: 8px 0; padding-left: 18px; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      background: var(--panel-2);
      color: var(--muted);
      margin-right: 6px;
    }
    .badge.high { background: rgba(255,107,107,0.18); color: var(--bad); }
    .badge.medium { background: rgba(255,180,84,0.18); color: var(--warn); }
    .badge.good { background: rgba(62,207,142,0.18); color: var(--good); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #243044; }
    th { color: var(--muted); font-weight: 600; }
    .empty { color: var(--muted); font-style: italic; }
    .status { font-size: 13px; color: var(--muted); min-height: 18px; }
  </style>
</head>
<body>
  <header>
    <h1>Pardon My Trade</h1>
    <div class="meta" id="meta">Loading…</div>
    <button id="refresh">Run Refresh</button>
  </header>

  <main>
    <section class="panel full" id="report-panel">
      <h2>Weekly Report</h2>
      <div id="report" class="report"><span class="empty">No report yet. Run a refresh.</span></div>
    </section>

    <section class="panel" id="alerts-panel">
      <h2>Alerts &amp; Notifications</h2>
      <div id="alerts"><span class="empty">None.</span></div>
    </section>

    <section class="panel" id="managers-panel">
      <h2>Manager Profiles</h2>
      <div id="managers"><span class="empty">None.</span></div>
    </section>

    <section class="panel full" id="news-panel">
      <h2>News</h2>
      <div id="news"><span class="empty">None.</span></div>
    </section>
  </main>

  <div class="status" id="status" style="padding:0 24px 20px;"></div>

  <script>
    const $ = (id) => document.getElementById(id);

    async function loadLeague() {
      const res = await fetch("/api/league");
      const league = await res.json();
      if (!league) {
        $("meta").textContent = "No snapshot loaded";
        return;
      }
      $("meta").textContent = `${league.name} · ${league.season} · ${league.teams.length} teams`;
      await Promise.all([loadRecommendations(), loadAlerts(), loadManagers(), loadNews()]);
    }

    async function loadRecommendations() {
      const res = await fetch("/api/recommendations");
      const recs = await res.json();
      const report = recs.find((r) => r.type === "weekly_report") || recs[0];
      const el = $("report");
      if (!report) { el.innerHTML = '<span class="empty">No report yet. Run a refresh.</span>'; return; }
      const reasoning = (report.reasoning || []).map((r) => `<li>${escapeHtml(r)}</li>`).join("");
      el.innerHTML = `
        <div class="title">${escapeHtml(report.title)}</div>
        <div>${escapeHtml(report.recommendation)}</div>
        <ul>${reasoning}</ul>
        <div>
          <span class="badge good">confidence ${report.confidence}</span>
          <span class="badge">${escapeHtml(report.risk.level)} risk</span>
          <span class="badge">benefit ${report.expected_benefit.value} ${escapeHtml(report.expected_benefit.metric)}</span>
        </div>
      `;
    }

    async function loadAlerts() {
      const res = await fetch("/api/alerts");
      const alerts = await res.json();
      const el = $("alerts");
      if (!alerts.length) { el.innerHTML = '<span class="empty">None.</span>'; return; }
      el.innerHTML = alerts.map((a) => `
        <div style="margin-bottom:10px;">
          <span class="badge ${a.priority}">${escapeHtml(a.priority)}</span>
          <strong>${escapeHtml(a.title)}</strong>
          <div style="color:var(--muted);font-size:13px;">${escapeHtml(a.body)}</div>
        </div>`).join("");
    }

    async function loadManagers() {
      const res = await fetch("/api/manager-profiles");
      const managers = await res.json();
      const el = $("managers");
      if (!managers.length) { el.innerHTML = '<span class="empty">None.</span>'; return; }
      el.innerHTML = `<table>
        <thead><tr><th>Manager</th><th>Trade Activity</th><th>Adds</th><th>Drops</th><th>Trades</th></tr></thead>
        <tbody>
          ${managers.map((m) => {
            const p = m.observed_behavior_profile;
            return `<tr><td>${escapeHtml(m.display_name)}</td><td>${escapeHtml(String(p.trade_activity ?? "-"))}</td><td>${p.adds ?? 0}</td><td>${p.drops ?? 0}</td><td>${p.trades ?? 0}</td></tr>`;
          }).join("")}
        </tbody>
      </table>`;
    }

    async function loadNews() {
      const res = await fetch("/api/news");
      const news = await res.json();
      const el = $("news");
      if (!news.length) { el.innerHTML = '<span class="empty">None.</span>'; return; }
      el.innerHTML = news.map((n) => `
        <div style="margin-bottom:8px;">
          <span class="badge ${n.impact}">${escapeHtml(n.impact)}</span>
          <strong>${escapeHtml(n.headline)}</strong>
          <div style="color:var(--muted);font-size:13px;">${escapeHtml(n.summary)}</div>
        </div>`).join("");
    }

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = String(value ?? "");
      return div.innerHTML;
    }

    $("refresh").addEventListener("click", async () => {
      const btn = $("refresh");
      btn.disabled = true;
      $("status").textContent = "Refreshing…";
      try {
        const res = await fetch("/api/refresh", { method: "POST" });
        const summary = await res.json();
        $("status").textContent = `Refreshed at ${summary.refreshed_at}: ${summary.news_ingested} news, ${summary.injury_alerts} alerts, ${summary.notifications_sent} notifications, report ${summary.weekly_report_id}.`;
        await loadLeague();
      } catch (err) {
        $("status").textContent = "Refresh failed: " + err.message;
      } finally {
        btn.disabled = false;
      }
    });

    loadLeague();
  </script>
</body>
</html>
