# Secret-free example. Merge the relevant entries into ~/.hermes/config.yaml
# after building PMT. Keep ESPN_S2 and SWID in ~/.hermes/.env or the gateway
# environment. Never replace the ${...} references with credential values in a
# tracked file.
#
# The pmt-read server is the normal Phase 4 Hermes integration. The operator
# server below is intentionally disabled and is not needed by the scheduled
# refresh/review jobs.
mcp_servers:
  pmt-read:
    command: node
    args:
      - /ABSOLUTE/PATH/TO/Pardon_My_Trade/dist/src/mcp/stdio.js
    env:
      PMT_DATA_DIR: /ABSOLUTE/PATH/TO/Pardon_My_Trade/data
      PMT_PROJECTION_SOURCES: espn,razzball,fftoday
      PMT_HISTORICAL_DATA_PATH: ${PMT_HISTORICAL_DATA_PATH}
      ESPN_LEAGUE_ID: ${ESPN_LEAGUE_ID}
      ESPN_SEASON: ${ESPN_SEASON}
      ESPN_S2: ${ESPN_S2}
      SWID: ${SWID}
    tools:
      include:
        - pmt_get_inseason_status
        - pmt_get_current_scoring_period
        - pmt_espn_read_league
        - pmt_espn_read_rosters
        - pmt_espn_read_schedule
        - pmt_espn_read_transactions
        - pmt_espn_read_players
        - pmt_espn_read_free_agents
        - pmt_refresh_projections
        - pmt_run_projection_refresh
        - pmt_get_projection_status
        - pmt_get_projection_provenance
        - pmt_run_news_injury_refresh
        - pmt_list_news
        - pmt_list_injury_alerts
        - pmt_list_notifications
        - pmt_run_advisory_orchestration
        - pmt_list_pending_actions
        - pmt_get_action
        - pmt_preview_action
        - pmt_get_model_status
        - pmt_get_model_artifact
        - pmt_evaluate_model
        - pmt_rebuild_models
        - pmt_update_post_week_outcomes
      prompts: false
      resources: false

  # Hermes Phase 5 write-executor boundary. Keep disabled until the operator
  # has reviewed the current-state and idempotency behavior and completed a
  # canary in the intended league. The executor never exposes raw ESPN writes;
  # it accepts only exact approved PMT queue actions.
  pmt-operator:
    enabled: false
    command: node
    args:
      - /ABSOLUTE/PATH/TO/Pardon_My_Trade/dist/src/mcp/stdio.js
    env:
      PMT_DATA_DIR: /ABSOLUTE/PATH/TO/Pardon_My_Trade/data
      PMT_HISTORICAL_DATA_PATH: ${PMT_HISTORICAL_DATA_PATH}
      ESPN_LEAGUE_ID: ${ESPN_LEAGUE_ID}
      ESPN_SEASON: ${ESPN_SEASON}
      ESPN_S2: ${ESPN_S2}
      SWID: ${SWID}
    tools:
      include:
        - pmt_list_pending_actions
        - pmt_get_action
        - pmt_preview_action
        - pmt_action_approve
        - pmt_action_reject
        - pmt_action_execute
        - pmt_get_action_audit
      prompts: false
      resources: false
